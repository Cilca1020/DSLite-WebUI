# ============================================================================
# DSLite-WebUI  Nginx 反向代理配置（HTTPS）
#
# 后端：Flask(waitress) 运行在 http://127.0.0.1:5000
# 证书：certs/dslite.crt + certs/dslite.key（自签名，一年有效）
#
# 功能：
#   - 80 端口：访问一律 301 跳转到 HTTPS
#   - 443 端口：SSL 反向代理到后端
#
# 放置方式：
#   1. 复制本文件到 nginx 安装目录 conf/ 下；
#   2. 在 conf/nginx.conf 的 http { } 内已有：
#         include nginx-dslite-webui.conf;
#   3. 确保证书位于 nginx 安装目录下的 certs/ 子目录（见 certs/ 说明）；
#   4. 重新加载：nginx -s reload
# ============================================================================

# ---------- HTTP：强制跳转到 HTTPS ----------
server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

# ---------- HTTPS：反向代理 ----------
server {
    listen 443 ssl;
    server_name _;

    # 证书路径（Windows 上建议使用绝对路径，避免相对路径解析差异）
    ssl_certificate     C:/Downloads/nginx-1.30.4/certs/dslite.crt;
    ssl_certificate_key C:/Downloads/nginx-1.30.4/certs/dslite.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # 安全响应头
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    client_max_body_size 10m;

    location / {
        proxy_pass http://127.0.0.1:5000;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        # ========== 关键：/api/chat 是流式响应 ==========
        proxy_buffering off;
        proxy_cache off;

        # 流式对话可能持续较久，放宽读写超时
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;

        # 本应用用 fetch 流式（非 WebSocket）
        proxy_set_header Connection "";
    }
}
