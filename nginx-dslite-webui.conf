# ============================================================================
# DSLite-WebUI  Nginx 反向代理配置（方案 B：Cloudflare 隧道 + 本地 HTTPS）
#
# 后端：Flask(waitress) 运行在 http://127.0.0.1:5000
# 证书：certs/dslite.crt + certs/dslite.key（自签名，一年有效，仅本地 443 用）
#
# 架构：
#   - 80 端口  ：直接代理到 Flask。
#                 ① Cloudflare Tunnel 从这里进入（公网 HTTPS 由 Cloudflare 终结，
#                    发到本地的是明文 HTTP → nginx :80 代理到 Flask）
#                 ② 本地 http://<ip>:80 也可直接访问
#   - 443 端口 ：SSL 反向代理到 Flask，服务本地 https://localhost（自签名证书）
#
# 放置方式：
#   1. 复制本文件到 nginx 安装目录 conf/ 下；
#   2. 在 conf/nginx.conf 的 http { } 内已有：
#         include nginx-dslite-webui.conf;
#   3. 确保证书位于 C:/Downloads/nginx-1.30.4/certs/（若 nginx 换了路径请改绝对路径）；
#   4. 重新加载：nginx -s reload
# ============================================================================

# ---------- HTTP：直接代理到 Flask（供 Cloudflare 隧道进入） ----------
server {
    listen 80;
    server_name _;

    # 安全响应头（不含 HSTS，避免影响本地明文访问）
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    client_max_body_size 10m;

    location / {
        proxy_pass http://127.0.0.1:5000;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # 尊重 Cloudflare 隧道传入的协议标记；无此头时回退到请求自身 scheme
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;

        # ========== 关键：/api/chat 是流式响应 ==========
        proxy_buffering off;
        proxy_cache off;

        proxy_read_timeout 300s;
        proxy_send_timeout 300s;

        proxy_set_header Connection "";
    }
}

# ---------- HTTPS：本地自签名，服务 https://localhost ----------
server {
    listen 443 ssl;
    server_name _;

    ssl_certificate     C:/Downloads/nginx-1.30.4/certs/dslite.crt;
    ssl_certificate_key C:/Downloads/nginx-1.30.4/certs/dslite.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    client_max_body_size 10m;

    location / {
        proxy_pass http://127.0.0.1:5000;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_set_header Connection "";
    }
}
