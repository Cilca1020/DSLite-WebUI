<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DeepSeek WebUI</title>
  <!-- 代码高亮配色（浅/深各一套，按当前主题启用；先于业务样式加载，便于业务样式覆盖） -->
  <link rel="stylesheet" href="/static/vendor/hljs-github.min.css" id="hljsLight" />
  <link rel="stylesheet" href="/static/vendor/hljs-dark.min.css" id="hljsDark" disabled />
  <link rel="stylesheet" href="/static/style-light.css" />
  <link rel="stylesheet" href="/static/style-dark.css" />
  <link rel="stylesheet" href="/static/style-responsive.css" />
  <!-- 文档解析库（用于将 pdf/docx/xlsx/pptx/odt 等二进制文档抽取为纯文本） -->
  <script src="https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mammoth@1.8.0/mammoth.browser.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
  <!-- 防闪烁：在样式应用前先确定主题 -->
  <script>
    (function () {
      var t = localStorage.getItem("dsw_theme") || "light";
      document.documentElement.setAttribute("data-theme", t);
      // 同步启用对应主题的代码高亮配色
      var light = document.getElementById("hljsLight");
      var dark = document.getElementById("hljsDark");
      if (light) light.disabled = t === "dark";
      if (dark) dark.disabled = t !== "dark";
    })();
  </script>
</head>
<body>
  <section id="authScreen" class="auth-screen hidden">
    <div class="auth-card">
      <div class="auth-mark">DS</div>
      <h1>DeepSeek WebUI</h1>
      <p id="authSubtitle">登录后继续使用</p>
      <form id="authForm">
        <label>账号<input id="authUsername" type="text" autocomplete="username" required minlength="3" maxlength="32" /></label>
        <label>密码<input id="authPassword" type="password" autocomplete="current-password" required minlength="6" /></label>
        <div class="captcha-row"><label>验证码<input id="authCaptcha" type="text" maxlength="5" autocomplete="off" required /></label><button id="captchaImageBtn" type="button" title="刷新验证码"><img id="captchaImage" alt="验证码" /></button></div>
        <p id="authError" class="auth-error" role="alert"></p>
        <button id="authSubmit" class="auth-submit" type="submit">登录</button>
      </form>
      <button id="authModeBtn" class="auth-mode" type="button">没有账号？注册</button>
    </div>
  </section>
  <div class="app" data-sidebar="open">
    <!-- 侧边栏：会话 + 预设 -->
    <aside class="sidebar">
      <div class="sidebar-section">
        <div class="sidebar-head">
          <span>会话</span>
          <button id="newSessionBtn" class="icon-btn" title="新建会话">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
          </button>
        </div>
        <ul id="sessionList" class="session-list"></ul>
      </div>
    </aside>

    <!-- 主区：对话 -->
    <main class="main">
      <header class="topbar">
        <button id="toggleSidebarBtn" class="icon-btn" title="收起/展开侧边栏">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h18M3 6h18M3 18h18"/></svg>
        </button>
        <select id="modelSelect" class="model-select"></select>
        <div class="topbar-right">
          <div class="account-menu">
            <button id="accountBtn" class="icon-btn account-btn" type="button" title="账户菜单" aria-label="账户菜单" aria-expanded="false">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21a8 8 0 0 0-16 0"/><circle cx="12" cy="7" r="4"/></svg>
            </button>
            <section id="accountCard" class="account-card hidden" aria-hidden="true">
              <div class="account-card-head">
                <div class="account-avatar" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="3.5"/><path d="M5 20c.8-3.2 3.2-5 7-5s6.2 1.8 7 5"/></svg></div>
                <div><strong id="userBadge"></strong><span id="accountStatus">已登录</span></div>
              </div>
              <button id="changePasswordBtn" class="account-action" type="button">修改密码</button>
              <form id="passwordForm" class="password-form hidden">
                <label>当前密码<input id="currentPassword" type="password" autocomplete="current-password" required /></label>
                <label>新密码<input id="newPassword" type="password" autocomplete="new-password" minlength="6" required /></label>
                <label>确认新密码<input id="confirmPassword" type="password" autocomplete="new-password" minlength="6" required /></label>
                <p id="passwordError" class="password-error" role="alert"></p>
                <div class="password-actions">
                  <button class="account-action" type="submit">确认修改</button>
                  <button id="cancelPasswordBtn" class="account-action" type="button">取消</button>
                </div>
              </form>
              <button id="logoutBtn" class="account-action account-logout" type="button">退出登录</button>
            </section>
          </div>
          <button id="themeBtn" class="icon-btn" title="切换深色/浅色"></button>
          <button id="openSettingsBtn" class="icon-btn" title="参数设置">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1Z"/></svg>
          </button>
        </div>
      </header>

      <div class="chat-wrap">
        <div id="chatBox" class="chat-box"></div>
        <!-- 置底按钮：悬浮在消息列表右下，滚动离开底部时浮现 -->
        <button id="scrollDownBtn" class="scroll-down-btn hidden" type="button" title="回到底部">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14"/><path d="M19 12l-7 7-7-7"/></svg>
        </button>
      </div>

      <footer class="input-bar">
        <!-- 文件区：位于输入框上方，含浏览按钮与已选文件卡片 -->
        <div id="fileZone" class="file-zone">
          <button id="attachBtn" class="attach-btn" type="button" title="添加文本文件">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg>
            <span>添加文件</span>
          </button>
          <button id="newlineBtn" class="newline-btn" type="button" title="在光标处插入换行（移动端键盘无 Shift 键）">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 10 4 15 9 20"/><path d="M20 4v7a4 4 0 0 1-4 4H4"/></svg>
          </button>
          <input id="fileInput" type="file" multiple accept=".txt,.md,.markdown,.json,.csv,.tsv,.log,.yaml,.yml,.xml,.ini,.toml,.conf,.py,.js,.ts,.html,.css,.c,.cpp,.h,.java,.go,.rs,.rb,.php,.sql,.sh,.bat,.ps1,.tex,.rtf,.pdf,.doc,.docx,.xls,.xlsx,.ppt,.pptx,.odt,.ods,.odp,.gitignore,.dockerfile,text/*" style="display:none" />
          <div id="fileChips" class="file-chips"></div>
        </div>
        <div class="input-row">
          <textarea id="userInput" class="user-input" rows="2"
                    placeholder="输入消息，Enter 发送，Shift+Enter 换行。也可拖放文本文件到此处"></textarea>
          <button id="sendBtn" class="send-btn">发送</button>
        </div>
      </footer>
    </main>
  </div>

  <!-- 设置面板（右侧抽屉 + 遮罩，默认关闭） -->
  <div id="settingsOverlay" class="settings-overlay hidden"></div>
  <aside id="settingsPanel" class="settings-panel hidden" aria-hidden="true">
    <div class="settings-head">
      <span>参数设置</span>
      <button id="closeSettingsBtn" class="icon-btn" title="关闭">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
    </div>

    <div class="settings-body">
      <section class="settings-group">
        <h3>API Key</h3>
        <label class="block">API Key（仅存于本浏览器）
          <input id="apiKeyInput" class="apikey-input" type="password"
                 placeholder="sk-...（控制台获取）" />
        </label>
        <div class="key-buttons">
          <a class="mini-btn" href="https://platform.deepseek.com/" target="_blank" rel="noopener noreferrer">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>
            <span>DeepSeek 开放平台</span>
          </a>
          <button id="clearKeyBtn" class="mini-btn">清除本地保存的 Key</button>
        </div>
      </section>

      <section class="settings-group">
        <h3>System Prompt</h3>
        <textarea id="system_prompt" rows="4"></textarea>
      </section>

      <section class="settings-group">
        <h3>界面</h3>
        <div class="param-field">
          <label>主题色</label>
          <div id="accentSwatches" class="swatches"></div>
          <span class="param-hint">主色应用于发送按钮与用户消息气泡，点击色块即时切换。</span>
        </div>
        <div class="param-field">
          <label for="msgFontSize">消息字号</label>
          <input id="msgFontSize" type="number" min="12" max="20" step="1" />
          <span class="param-hint">消息正文字号（12~20px），默认 14px；行内代码与代码块随之缩放。</span>
        </div>
        <div class="param-field">
          <label for="autoCollapseReasoning">思考过程自动收起</label>
          <label class="switch-row" for="autoCollapseReasoning">
            <input id="autoCollapseReasoning" type="checkbox" />
            <span class="switch-track"><span class="switch-thumb"></span></span>
          </label>
          <span class="param-hint">生成新回答时，思考过程随正文输出自动折叠收起；关闭后始终保持展开。</span>
        </div>
      </section>

      <section class="settings-group">
        <h3>推理参数</h3>
        <div class="param-field">
          <label for="temperature">Temperature</label>
          <input id="temperature" data-key="temperature" type="number" step="0.1" min="0" max="2" />
          <span class="param-hint" data-hint="temperature"></span>
        </div>
        <div class="param-field">
          <label for="top_p">Top P</label>
          <input id="top_p" data-key="top_p" type="number" step="0.05" min="0" max="1" />
          <span class="param-hint" data-hint="top_p"></span>
        </div>
        <div class="param-field">
          <label for="max_tokens">Max Tokens</label>
          <input id="max_tokens" data-key="max_tokens" type="number" step="1" min="1" max="8192" />
          <span class="param-hint" data-hint="max_tokens"></span>
        </div>
        <div class="param-field">
          <label for="frequency_penalty">Frequency Penalty</label>
          <input id="frequency_penalty" data-key="frequency_penalty" type="number" step="0.1" min="-2" max="2" />
          <span class="param-hint" data-hint="frequency_penalty"></span>
        </div>
        <div class="param-field">
          <label for="presence_penalty">Presence Penalty</label>
          <input id="presence_penalty" data-key="presence_penalty" type="number" step="0.1" min="-2" max="2" />
          <span class="param-hint" data-hint="presence_penalty"></span>
        </div>
        <div class="param-field">
          <label for="stop">Stop 序列</label>
          <input id="stop" data-key="stop" type="text" placeholder="如：\n, ###, 结束" />
          <span class="param-hint" data-hint="stop"></span>
        </div>
      </section>
    </div>
  </aside>

  <script src="/static/vendor/marked.min.js"></script>
  <script src="/static/vendor/highlight.min.js"></script>
  <script src="/static/file_reader.js"></script>
  <!-- 前端主逻辑按依赖顺序拆分加载：基础工具 → API → 渲染 → 会话 → 聊天 → 入口 -->
  <script src="/static/icons.js"></script>
  <script src="/static/api.js"></script>
  <script src="/static/render.js"></script>
  <script src="/static/sessions.js"></script>
  <script src="/static/export.js"></script>
  <script src="/static/chat.js"></script>
  <script src="/static/auth.js"></script>
  <script src="/static/main.js"></script>
</body>
</html>
